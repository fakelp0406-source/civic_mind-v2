known_limitations:
- City-level only; MoRTH's city boundary definition is not established - never join to ward data.
- Later editions may restate earlier years; cite the edition.
- National series; irregular years (1970, 1980, 1990, 1995-2024); exclude the 'CAGR 2014/2024' row.
- 'Publisher note: ''# Data for the year 1971. ## Data for the year 1981.'' The CSV does not carry the
  markers; the 1970/1980 per-10,000-km rates do not reproduce from the 1970/1980 road length (probably
  because a 1971/1981 value was used; not confirmed).'
- Road length and vehicles are financial-year; accidents calendar-year (publisher).
