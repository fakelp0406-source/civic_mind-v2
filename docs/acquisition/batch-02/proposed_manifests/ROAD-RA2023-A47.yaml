known_limitations:
- City-level only; MoRTH's city boundary definition is not established - never join to ward data.
- Later editions may restate earlier years; cite the edition.
- Category allocation between violation types (notably Over-Speeding vs Others) varies by city and year;
  single-city category trends need the per-city stability caveat.
- Whether the six categories partition all city accidents is not established; never report their sum as
  'total accidents'.
