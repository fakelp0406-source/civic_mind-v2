# Labelled evaluation set for document retrieval (Milestone 05, stage 2E), version 1.
#
# Corpus: the approved docs-01 documents only (DOC-MORTH-RA2019 with pages 2-7 excluded,
# DOC-MORTH-RA2023); RA2024 is quarantined and not in the corpus.
#
# How the labels were made (2026-10-18), before any retriever was run on these questions:
# - Supported items: the labeller (the Claude Code session that built the system; no second
#   reviewer) read the extracted page text and chose short key phrases that state the answer.
#   Gold pages were then computed mechanically: every approved, non-excluded corpus page whose
#   whitespace-normalised, lower-cased text contains ANY key phrase, restricted to the asked
#   edition's document when the question names a year. Duplicate pages in RA2019 are therefore
#   both gold. Disclosure: the labeller had seen retrieval output for one question (grievous
#   injury, S02) during the stage 2C sanity check.
# - Absent and misleading items: verification phrases for the asked fact were checked to match
#   NO corpus page. Misleading items reuse corpus vocabulary on purpose (for example M01: the
#   corpus mentions speed-limit signs, an 80 kmph car alert and a 40 kmph cap for children on
#   motorcycles, but no Karnataka highway speed limit).
# - Edition items: the corpus has no approved 2024 document; "latest" is not resolved silently
#   (the same policy as the deterministic pipeline), so all four expect abstention.
# - Analytics and composite items probe routing; they are not scored as document answers.
#
# expect: answer | abstain | deterministic | not_supported. Split (calibration / test) is
# derived deterministically in eval/rag_metrics.py, never edited here.
# This file is frozen: eval/rag_metrics.py reports its SHA-256 with every result.
