#
# Read by scripts/process_doc_batch.py. Holds only what a PERSON records; sizes, hashes, page
# counts, extraction and screening are computed from the bytes by the processor.
#
# Status of this file (2026-10-18): TEMPLATE. Entries were prefilled from
# docs/discovery/civicmind_dataset_catalog.csv only (ids, catalogue titles, landing URLs).
# Nothing has been downloaded or opened. Before running the processor on a document:
#   1. Download the PDF by hand and save it UNCHANGED as
#      data/external/verify_docs-01/docs/<water|roads>/<original file name>
#      (tools never download documents or complete portal forms).
#   2. Fill in: original_filename, local_path, retrieved_at (ISO 8601 with time zone),
#      retrieved_by, download_url (exact URL used), stated_bytes (if the page states a size).
#   3. Replace title / publication_date / edition with what is PRINTED on the document.
#   4. Record licence evidence (where the reuse terms were read). An UNKNOWN licence blocks
#      promotion.
#   5. Set source_class to "secondary_mirror" if the copy did not come from the issuing
#      authority's own site (e.g. data.opencity.in).
# Then: python scripts/process_doc_batch.py docs-01
