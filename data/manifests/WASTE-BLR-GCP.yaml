known_limitations:
- 2015-2018 data under SWM Rules 2016; no post-2019 ward waste data.
- 'MODELLED ESTIMATES, not ward measurements: generated 2016-17 = 2015-16 x 1.052632 and collected 2017-18
  = 2016-17 x 1.052632 in all 198 wards; processed = 60% / 65% / 70%.'
- Do not compare collection or processing efficiency between wards (collected equals generated in every
  ward for 2015-16 and 2016-17).
- The 2017-18 'generated' column is inconsistent with 'collected' (collected exceeds generated in 197
  of 198 wards).
